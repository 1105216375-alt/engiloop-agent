[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-domain-agent"
version = "0.1.0"
description = "EngiLoop: verifiable domain agents through neuro-symbolic execution"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE", "LICENSES/Apache-2.0.txt"]
authors = [{name = "1105216375-alt"}]
dependencies = []

[project.optional-dependencies]
reports = ["python-docx>=1.2,<2"]
dev = ["pytest>=7.4,<9", "python-docx>=1.2,<2", "build>=1.2,<2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["engineering_agent*", "nskernel*", "bip_runtime*", "domain*", "legacy_v7*", "examples*"]
exclude = ["tests*", "work*", "outputs*"]

[tool.setuptools.package-data]
examples = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
